<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT'S CRADLE — Neural String Interface</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020818; overflow: hidden; font-family: 'Share Tech Mono', monospace; color: #0ff; }
  #container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #defaultCanvas0 { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; }
  #crt {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.09) 2px, rgba(0,0,0,0.09) 4px);
    z-index: 10;
  }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(2,8,24,0.9) 100%);
    z-index: 11;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    padding: 18px 28px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
  }
  .hud-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(13px,2vw,19px); letter-spacing: 0.22em; color: #0ff; text-shadow: 0 0 12px #0ff, 0 0 30px #0ff8; line-height: 1.3; }
  .hud-sub { font-size: 10px; letter-spacing: 0.18em; color: #0ff7; margin-top: 3px; text-shadow: 0 0 8px #0ff5; }
  .hud-status { text-align: right; font-size: 11px; letter-spacing: 0.1em; line-height: 2.0; color: #0ff9; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .corner { position: absolute; width: 38px; height: 38px; z-index: 21; pointer-events: none; }
  .corner::before, .corner::after { content:''; position: absolute; background: #0ff; box-shadow: 0 0 5px #0ff; }
  .corner::before { width:100%; height:1px; top:0; left:0; }
  .corner::after  { width:1px; height:100%; top:0; left:0; }
  .corner.tl { top:12px; left:12px; }
  .corner.tr { top:12px; right:12px; transform:scaleX(-1); }
  .corner.bl { bottom:12px; left:12px; transform:scaleY(-1); }
  .corner.br { bottom:12px; right:12px; transform:scale(-1); }
  #startup {
    position: absolute; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(2,8,24,0.97); transition: opacity 0.9s ease;
  }
  #startup.hidden { opacity:0; pointer-events:none; }
  .startup-title {
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(28px,6vw,62px);
    letter-spacing: 0.25em; color: #0ff;
    text-shadow: 0 0 20px #0ff, 0 0 60px #0ff8, 0 0 120px #0ff3;
    animation: flicker 4s infinite; text-align: center;
  }
  @keyframes flicker { 0%,95%,100%{opacity:1} 96%{opacity:0.5} 97%{opacity:1} 99%{opacity:0.3} }
  .startup-sub { font-size: clamp(9px,1.4vw,12px); letter-spacing: 0.28em; color: #f0f9; margin-top: 10px; text-align: center; text-shadow: 0 0 10px #f0f4; }
  .startup-btn {
    margin-top: 50px; padding: 14px 44px; border: 1px solid #0ff; background: transparent;
    color: #0ff; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px;
    letter-spacing: 0.28em; cursor: pointer; text-shadow: 0 0 8px #0ff;
    box-shadow: 0 0 14px #0ff5, inset 0 0 14px #0ff1; transition: all 0.2s; position: relative; overflow: hidden;
  }
  .startup-btn::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,#0ff2,transparent); transform:translateX(-100%); transition:transform 0.4s; }
  .startup-btn:hover::before { transform:translateX(100%); }
  .startup-btn:hover { background:#0ff1; box-shadow:0 0 28px #0ffa, inset 0 0 22px #0ff2; }
  .startup-hint { margin-top: 20px; font-size: 10px; letter-spacing: 0.18em; color: #fff4; text-align: center; }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <div id="crt"></div>
  <div id="vignette"></div>
  <div id="hud">
    <div>
      <div class="hud-title">CAT'S CRADLE</div>
      <div class="hud-sub">NEURAL STRING INTERFACE v2.1</div>
    </div>
    <div class="hud-status">
      <span class="dot" style="background:#f0f;box-shadow:0 0 6px #f0f"></span>TRACKING ACTIVE<br>
      <span class="dot" style="background:#ff0;box-shadow:0 0 6px #ff0;animation-delay:.4s"></span>HANDS:&nbsp;<span id="handCount">0</span><br>
      <span class="dot" style="background:#0f0;box-shadow:0 0 6px #0f0;animation-delay:.8s"></span>STRINGS:&nbsp;<span id="stringCount">0</span>
    </div>
  </div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div id="startup">
    <div class="startup-title">CAT'S CRADLE</div>
    <div class="startup-sub">NEURAL STRING INTERFACE // MEDIAPIPE HANDS</div>
    <button class="startup-btn" id="startBtn">INITIALIZE CAMERA</button>
    <div class="startup-hint">PLACE BOTH HANDS IN FRAME — FINGERTIPS CONTROL THE STRINGS</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
let mpHands, mpCamera;
let handsData = [];
let particles = [];
let initialized = false;

const FINGERTIPS = [4, 8, 12, 16, 20];
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17]
];

const PALETTE = [
  {r:0,   g:255, b:255, hex:'#00ffff'},   // cyan
  {r:255, g:0,   b:255, hex:'#ff00ff'},   // magenta
  {r:255, g:255, b:0,   hex:'#ffff00'},   // yellow
  {r:0,   g:255, b:140, hex:'#00ff8c'},   // spring green
  {r:255, g:80,  b:200, hex:'#ff50c8'},   // hot pink
];

new p5(function(p) {
  p.setup = function() {
    let cnv = p.createCanvas(p.windowWidth, p.windowHeight);
    cnv.parent('container');
    p.colorMode(p.RGB, 255);
    p.frameRate(60);
  };

  p.windowResized = function() {
    p.resizeCanvas(p.windowWidth, p.windowHeight);
  };

  function lm(landmarks, i) {
    let lp = landmarks[i];
    return { x: (1 - lp.x) * p.width, y: lp.y * p.height };
  }

  p.draw = function() {
    p.background(2, 8, 24);
    const hands = handsData;

    let leftHand = null, rightHand = null;
    for (let h of hands) {
      if (h.label === 'Left')  leftHand  = h;
      if (h.label === 'Right') rightHand = h;
    }

    // Ambient glow blobs for each hand
    drawHandGlow(leftHand,  [255, 0, 170]);
    drawHandGlow(rightHand, [0, 200, 255]);

    // Skeleton
    if (leftHand)  drawSkeleton(leftHand,  '#ff00aa55');
    if (rightHand) drawSkeleton(rightHand, '#00eeff55');

    // Joints
    if (leftHand)  drawJoints(leftHand,  '#ff00cc', '#ff77ee');
    if (rightHand) drawJoints(rightHand, '#00ccff', '#88eeff');

    // Strings
    let sc = 0;
    if (leftHand && rightHand) sc = drawStrings(leftHand, rightHand);

    // Particles
    drawParticles();

    document.getElementById('handCount').textContent = hands.length;
    document.getElementById('stringCount').textContent = sc;
  };

  function drawHandGlow(h, col) {
    if (!h) return;
    let ctx = p.drawingContext;
    ctx.save();
    for (let lp of h.landmarks) {
      let x = (1 - lp.x) * p.width, y = lp.y * p.height;
      let gr = ctx.createRadialGradient(x, y, 0, x, y, 45);
      gr.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0.07)`);
      gr.addColorStop(1, 'transparent');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(x, y, 45, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSkeleton(h, color) {
    let ctx = p.drawingContext;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.shadowBlur = 8;
    ctx.shadowColor = color.slice(0,7);
    for (let [a, b] of CONNECTIONS) {
      let pa = lm(h.landmarks, a), pb = lm(h.landmarks, b);
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawJoints(h, innerCol, outerCol) {
    let ctx = p.drawingContext;
    ctx.save();
    for (let i = 0; i < h.landmarks.length; i++) {
      let pt = lm(h.landmarks, i);
      let isTip = FINGERTIPS.includes(i);
      let r = isTip ? 6.5 : 3;
      ctx.shadowBlur = isTip ? 24 : 10;
      ctx.shadowColor = outerCol;
      ctx.fillStyle = isTip ? '#ffffff' : innerCol;
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI*2); ctx.fill();
      if (isTip) {
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = outerCol;
        ctx.shadowBlur = 32;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, r*3, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawStrings(lh, rh) {
    let ctx = p.drawingContext;
    ctx.save();
    ctx.lineCap = 'round';
    let count = 0;

    for (let i = 0; i < FINGERTIPS.length; i++) {
      let pL = lm(lh.landmarks, FINGERTIPS[i]);
      let pR = lm(rh.landmarks, FINGERTIPS[i]);
      let col = PALETTE[i % PALETTE.length];

      let dx = pR.x - pL.x, dy = pR.y - pL.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      let t = Math.min(dist / (p.width * 0.75), 1.0);

      // Elastic: thicker when close, thinner when stretched
      let thickness = p.lerp(5.5, 1.2, t);
      let glowRadius = p.lerp(22, 7, t);
      let alpha = p.lerp(1.0, 0.55, t);

      // Control point — sagging curve
      let mx = (pL.x + pR.x) / 2;
      let my = (pL.y + pR.y) / 2 + dist * 0.1;

      let rgb = `rgb(${col.r},${col.g},${col.b})`;

      // Outermost diffuse glow
      ctx.globalAlpha = alpha * 0.18;
      ctx.lineWidth = thickness * 7;
      ctx.strokeStyle = rgb;
      ctx.shadowBlur = glowRadius * 3;
      ctx.shadowColor = rgb;
      ctx.beginPath(); ctx.moveTo(pL.x, pL.y); ctx.quadraticCurveTo(mx, my, pR.x, pR.y); ctx.stroke();

      // Mid glow
      ctx.globalAlpha = alpha * 0.45;
      ctx.lineWidth = thickness * 3;
      ctx.shadowBlur = glowRadius * 1.5;
      ctx.beginPath(); ctx.moveTo(pL.x, pL.y); ctx.quadraticCurveTo(mx, my, pR.x, pR.y); ctx.stroke();

      // Core beam
      ctx.globalAlpha = alpha;
      ctx.lineWidth = thickness;
      ctx.shadowBlur = 5;
      ctx.strokeStyle = rgb;
      ctx.beginPath(); ctx.moveTo(pL.x, pL.y); ctx.quadraticCurveTo(mx, my, pR.x, pR.y); ctx.stroke();

      // White hot center
      ctx.globalAlpha = alpha * 0.85;
      ctx.lineWidth = thickness * 0.3;
      ctx.strokeStyle = '#ffffff';
      ctx.shadowBlur = 2;
      ctx.beginPath(); ctx.moveTo(pL.x, pL.y); ctx.quadraticCurveTo(mx, my, pR.x, pR.y); ctx.stroke();

      // Touch explosion
      if (dist < 30 && p.frameCount % 3 === 0) {
        spawnBurst((pL.x+pR.x)/2, (pL.y+pR.y)/2, col);
      }

      count++;
    }
    ctx.restore();
    return count;
  }

  function spawnBurst(x, y, col) {
    let n = Math.floor(Math.random()*8) + 5;
    for (let i = 0; i < n; i++) {
      let angle = Math.random() * Math.PI * 2;
      let speed = Math.random() * 6 + 1.5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        decay: Math.random() * 0.035 + 0.02,
        r: col.r, g: col.g, b: col.b,
        size: Math.random() * 5 + 2
      });
    }
  }

  function drawParticles() {
    if (!particles.length) return;
    let ctx = p.drawingContext;
    ctx.save();
    for (let i = particles.length - 1; i >= 0; i--) {
      let pt = particles[i];
      pt.x  += pt.vx; pt.y += pt.vy;
      pt.vy += 0.15; pt.vx *= 0.97;
      pt.life -= pt.decay;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = pt.life * pt.life;
      ctx.shadowBlur = 14;
      ctx.shadowColor = `rgb(${pt.r},${pt.g},${pt.b})`;
      ctx.fillStyle   = `rgb(${pt.r},${pt.g},${pt.b})`;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
});

async function initMediaPipe() {
  const video = document.getElementById('video');

  // ── Step 1: get front camera via getUserMedia directly (works on mobile) ──
  const constraints = {
    video: {
      facingMode: { ideal: 'user' },   // front/selfie cam
      width:  { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  };

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (err) {
    // Fallback: try without facingMode constraint (some older Android browsers)
    console.warn('Front-camera constraint failed, falling back:', err);
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  }

  video.srcObject = stream;
  // Wait for video to be ready
  await new Promise((resolve, reject) => {
    video.onloadedmetadata = () => {
      video.play().then(resolve).catch(reject);
    };
    video.onerror = reject;
  });

  // ── Step 2: set up MediaPipe Hands ────────────────────────────────────────
  mpHands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  mpHands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
  });
  mpHands.onResults(results => {
    handsData = [];
    if (results.multiHandLandmarks && results.multiHandedness) {
      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        handsData.push({
          landmarks: results.multiHandLandmarks[i],
          label: results.multiHandedness[i].label
        });
      }
    }
  });

  // ── Step 3: drive MediaPipe with requestAnimationFrame (no Camera util) ──
  async function processFrame() {
    if (video.readyState >= 2) {
      await mpHands.send({ image: video });
    }
    requestAnimationFrame(processFrame);
  }
  requestAnimationFrame(processFrame);
}

document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  btn.textContent = 'INITIALIZING...';
  btn.disabled = true;
  try {
    await initMediaPipe();
    initialized = true;
    const startup = document.getElementById('startup');
    startup.classList.add('hidden');
    setTimeout(() => { startup.style.display = 'none'; }, 1000);
  } catch(e) {
    console.error(e);
    let msg = 'ERROR — RETRY';
    if (e.name === 'NotAllowedError') msg = 'CAMERA DENIED — ALLOW & RETRY';
    else if (e.name === 'NotFoundError') msg = 'NO CAMERA FOUND';
    else if (e.name === 'NotReadableError') msg = 'CAMERA IN USE — RETRY';
    btn.textContent = msg;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
